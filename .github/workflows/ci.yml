name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências
        run: dotnet restore MariaEmMeuLar.sln

      - name: Build
        run: dotnet build MariaEmMeuLar.sln --no-restore -c Release

      - name: Testes
        run: dotnet test MariaEmMeuLar.sln --no-build -c Release --verbosity normal
